name: LineBrowser
options:
  bundleIdPrefix: com.lineinc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3JPP9CAURK
    ENABLE_PREVIEWS: YES

targets:
  LineBrowser:
    type: application
    platform: iOS
    sources:
      # Whitelist: only Swift sources and the asset catalog. A bare `path: .`
      # would sweep every stray file in the repo root into the .app (it shipped
      # a 3.5 MB .ipa and the README before this became explicit).
      - path: .
        includes:
          - "*.swift"
          - "Assets.xcassets"
    info:
      path: Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "Line Browser"
        CFBundleDisplayName: "Line Browser"
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad requires all four orientations for multitasking support
        # (App Store validation error 90474 otherwise).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSFaceIDUsageDescription: "Face ID unlocks your private vault and passwords."
        # Uses only built-in iOS crypto (AES-GCM via CryptoKit, TLS) —
        # skips App Store Connect's export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        # Registers http/https so iOS offers Line Browser in
        # Settings ▸ Default Browser App and hands links to us.
        CFBundleURLTypes:
          - CFBundleURLName: "Web links"
            CFBundleRole: "Viewer"
            CFBundleURLSchemes:
              - "http"
              - "https"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lineinc.linebrowser
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        # 1.2.0 = VPN removed + design-token UI rewrite. Must match the
        # git tag; build number must keep rising (4 was already used).
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 5
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES

# Shared schemes — Xcode Cloud can only build schemes committed to the
# repo under xcshareddata/xcschemes, so these must be generated, not auto.
schemes:
  LineBrowser:
    build:
      targets:
        LineBrowser: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
