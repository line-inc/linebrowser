name: Build iOS App (.ipa)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ios:
    name: Package Xcode Project (.xcodeproj)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package Xcode Project as Zip
        run: |
          mkdir -p iosApp/build/zip
          cd iosApp
          zip -r build/zip/LineBrowser-iOS-XcodeProject.zip . -x "build/*" ".DS_Store"
          cd ..

      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineBrowser-iOS-XcodeProject
          path: iosApp/build/zip/*.zip
          if-no-files-found: ignore
