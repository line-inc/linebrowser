name: Build iOS App (.ipa)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ios:
    name: Build iOS Source Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package iOS SwiftUI Source Code
        run: |
          mkdir -p iosApp/build/ipa
          cd iosApp
          zip -r build/ipa/LineBrowser-iOS-Source.zip .
          cd ..

      - name: Upload Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineBrowser-iOS-Source-Code
          path: iosApp/build/ipa/*.zip
          if-no-files-found: ignore
