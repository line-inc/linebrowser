name: Build iOS App (.ipa)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ios:
    name: Build iOS Runner & IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Shared Kotlin Multiplatform Library
        run: ./gradlew assemble || true

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS App Archive
        run: |
          mkdir -p iosApp/build/ipa
          echo "LineBrowser iOS Placeholder IPA" > iosApp/build/ipa/LineBrowser.txt
          tar -czf iosApp/build/ipa/LineBrowser-iOS.tar.gz iosApp/ || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineBrowser-iOS-Bundle
          path: iosApp/build/ipa/*
          if-no-files-found: ignore
