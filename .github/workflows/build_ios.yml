name: Build iOS App (.ipa)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ios:
    name: Build iOS App & IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS App .ipa for Simulator
        run: |
          cd iosApp
          mkdir -p build/ipa
          
          # Create Payload structure for valid IPA/App container
          mkdir -p Payload/LineBrowser.app
          cp Info.plist Payload/LineBrowser.app/
          
          # Compile swift files for iOS Simulator (arm64-apple-ios-simulator)
          swiftc -target arm64-apple-ios15.0-simulator -emit-executable iosApp.swift ContentView.swift BrowserModel.swift SettingsView.swift -o Payload/LineBrowser.app/LineBrowser
          
          cd Payload
          zip -r ../build/ipa/LineBrowser-iOS-Simulator.ipa LineBrowser.app
          cd ..
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineBrowser-iOS-Simulator-IPA
          path: iosApp/build/ipa/*.ipa
          if-no-files-found: ignore
