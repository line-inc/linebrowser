[package]
name = "line-browser-desktop"
version = "1.0.0"
description = "Line Browser Desktop for Windows and Linux"
authors = ["Line Inc."]
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
