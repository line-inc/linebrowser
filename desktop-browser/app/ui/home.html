<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LineBrowser</title>
  <link rel="icon" href="assets/lineinc.jpeg" type="image/jpeg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <img class="brand-mark" src="assets/lineinc.jpeg" alt="Line Inc." />
    <h1>LineBrowser</h1>
    <p class="sub">Privacy first · powered by Line Inc. & Gecko · DuckDuckGo</p>
    <form class="search" id="search-form">
      <input id="q" type="search" placeholder="Search or enter address" autofocus />
      <button type="submit">Go</button>
    </form>
    <div class="grid">
      <a class="card" href="bookmarks.html"><strong>Bookmarks</strong><span>Saved pages</span></a>
      <a class="card" href="history.html"><strong>History</strong><span>Visited sites</span></a>
      <a class="card" href="settings.html"><strong>Settings</strong><span>Line Shield, Seif, privacy, wallpapers</span></a>
      <a class="card" id="downloads" href="#"><strong>Downloads</strong><span>Saved files</span></a>
      <a class="card" id="private" href="#"><strong>Private window</strong><span>Incognito</span></a>
      <a class="card" href="https://addons.mozilla.org/"><strong>Extensions</strong><span>Line Browser Extensions</span></a>
    </div>
    <footer>Copyright © 2026 Line Inc. All rights reserved.</footer>
  </div>
  <script src="home.js"></script>
</body>
</html>
